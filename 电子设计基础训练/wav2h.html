<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAV to Header File Converter</title>
</head>
<body>
    <h1>WAV to Header File Converter</h1>
    <input type="file" id="fileInput" accept=".wav">
    <button onclick="convertToHeader()">Convert to Header (.h)</button>
    <pre id="output"></pre>

    <script>
        function convertToHeader() {
            const fileInput = document.getElementById("fileInput");
            const file = fileInput.files[0];

            if (!file) {
                alert("Please select a WAV file.");
                return;
            }

            const reader = new FileReader();
            reader.onload = function (e) {
                const wavData = new Uint8Array(e.target.result);

                // Check if it is a valid WAV file by checking the RIFF header
                if (wavData[0] !== 0x52 || wavData[1] !== 0x49 || wavData[2] !== 0x46 || wavData[3] !== 0x46) {
                    alert("Invalid WAV file.");
                    return;
                }

                // Create the header file content
                let headerContent = "// Auto-generated from WAV file\n";
                headerContent += "unsigned const char WavData[] = {";

                // Convert the WAV data to a C array
                for (let i = 0; i < wavData.length; i++) {
                    headerContent += "0x" + wavData[i].toString(16).padStart(2, "0").toUpperCase();
                    if (i < wavData.length - 1) {
                        headerContent += ", ";
                    }
                    if ((i + 1) % 16 === 0) {
                        headerContent += "\n";
                    }
                }

                headerContent += "\n};\n\n";

                // Display the generated header content
                document.getElementById("output").textContent = headerContent;

                // Optionally, download the header file
                const blob = new Blob([headerContent], { type: "text/plain" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = "WavData.h";
                link.click();
            };

            reader.readAsArrayBuffer(file);
        }
    </script>
</body>
</html>
